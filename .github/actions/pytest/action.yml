name: 'Python runtime test'
description: 'Run dnsReaper tests against a given Python version'
inputs:
  python-version:
    description: 'Python version'
    required: true
runs:
  using: composite
  steps:
    - name: Set up Python ${{ inputs.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
    - name: Python version
      id: python-version
      run: python --version
      shell: bash
    - name: install requirements
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt -r test-requirements.txt
      shell: bash
    - name: offline tests
      run: python -m pytest -v -k "not active"
      shell: bash
    - name: active network tests
      # Live DNS/HTTPS checks depend on third-party services. Report them,
      # but do not block a pull request when one of those services is down.
      run: python -m pytest -v -k "active"
      continue-on-error: true
      shell: bash
